name: Phorto
options:
  bundleIdPrefix: com.arii
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Phorto:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Phorto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arii.Phorto
        PRODUCT_NAME: Phorto
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Phorto
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "写真を1枚ずつ表示してアルバムへ仕分けるために、写真ライブラリへのアクセスが必要です。"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "仕分けた写真をアルバムに追加するために、写真ライブラリへの書き込みが必要です。"

  PhortoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhortoTests
    dependencies:
      - target: Phorto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arii.PhortoTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Phorto:
    build:
      targets:
        Phorto: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhortoTests
